[project]
site_name = "ra-mcp"
site_description = "MCP server and CLI for searching and browsing transcribed historical documents from the Swedish National Archives (Riksarkivet)."
site_author = "AI-Riksarkivet"
site_url = "https://ai-riksarkivet.github.io/ra-mcp/"
copyright = """
Copyright &copy; 2026 AI-Riksarkivet
"""
repo_url = "https://github.com/AI-Riksarkivet/ra-mcp"
repo_name = "AI-Riksarkivet/ra-mcp"
edit_uri = "edit/main/docs/"

nav = [
  { "ra-mcp" = [
    "index.md",
  ]},
  { "Getting Started" = [
    {"Connect" = "getting-started/index.md"},
    {"Plugins" = "getting-started/plugins.md"},
    {"Local Install" = "getting-started/local.md"},
  ]},
  { "How it Works" = [
    {"MCP & Tools" = "how-it-works/index.md"},
    {"Data Sources" = "how-it-works/data-sources.md"},
    {"Architecture" = "how-it-works/architecture.md"},
  ]},
  { "Tools & Skills" = [
    {"Overview" = "tools/index.md"},
    {"MCP Tools" = "tools/tools.md"},
    {"Skills" = "tools/skills.md"},
  ]},
  { "CLI" = [
    {"Overview" = "cli/index.md"},
    {"ra search" = "cli/search.md"},
    {"ra browse" = "cli/browse.md"},
    {"ra serve & tui" = "cli/serve.md"},
  ]},
  { "API" = [
    {"Overview" = "api/index.md"},
    {"Common" = "api/common.md"},
    {"Search" = "api/search.md"},
    {"Browse" = "api/browse.md"},
    {"MCP Tools" = "api/mcp-tools.md"},
  ]},
  { "Development" = [
    {"Setup" = "development/index.md"},
    {"Deployment" = "development/deployment.md"},
    {"Observability" = "development/observability.md"},
    {"Security" = "development/security.md"},
  ]},
]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]
language = "en"
favicon = "assets/favicon.ico"
logo = "assets/ra.svg"
custom_dir = "docs/overrides"

features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

# ----------------------------------------------------------------------------
# Color palette (light/dark toggle)
# ----------------------------------------------------------------------------
[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ----------------------------------------------------------------------------
# Icons
# ----------------------------------------------------------------------------
[project.theme.icon]
repo = "fontawesome/brands/github"

# ----------------------------------------------------------------------------
# Social links
# ----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/AI-Riksarkivet/ra-mcp"

[[project.extra.social]]
icon = "fontawesome/brands/docker"
link = "https://hub.docker.com/r/riksarkivet/ra-mcp"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/ra-mcp/"

# ----------------------------------------------------------------------------
# Analytics (Matomo)
# ----------------------------------------------------------------------------
[project.extra.analytics]
provider = "custom"

# ----------------------------------------------------------------------------
# Markdown extensions
# ----------------------------------------------------------------------------
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

# ----------------------------------------------------------------------------
# API reference
# ----------------------------------------------------------------------------
# The API pages under docs/api/ are hand-curated (see docs/api/*.md), not
# generated by mkdocstrings. zensical 0.0.23's mkdocstrings compat bridge
# (zensical/compat/autorefs.py mocks the autorefs plugin without a
# `current_page`) raises a swallowed AttributeError on every `:::` block, and
# that error aborts the ENTIRE page-rendering pass — leaving the whole site
# empty. Until a zensical release ships a fixed bridge, the API reference is
# authored by hand with links back to the source. To re-enable autodoc later,
# add the `[project.plugins.mkdocstrings]` handler config and restore the `:::`
# directives.
