[project]
name = "ra-mcp-dataset-lib"
version = "0.1.0"
description = "Shared LanceDB spine for the ra-mcp dataset libraries — SearchResult, connection caching, Swedish FTS index, and a correct instrumented full-text search"
requires-python = ">=3.13"
dependencies = [
    "lancedb>=0.20,<1",
    "pyarrow>=18,<25",
    "pydantic>=2,<3",
    "opentelemetry-api>=1.28.0",
    "ra-mcp-common",
]
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ra_mcp_dataset_lib"]
