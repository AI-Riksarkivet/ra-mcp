name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Checks and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Code Quality Checks
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: checks
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "latest"

      - name: Run Tests
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: test
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "latest"

  ui-tests:
    name: UI logic tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Tag ref (not SHA-pinned) so it always resolves; dependabot pins it like the others.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The MCP App UIs' pure logic (geometry/coordinate transforms, parsers) is unit-tested
      # with vitest — no browser needed. Gates merges alongside the Python suite.
      - name: viewer-mcp vitest
        working-directory: packages/mcps/viewer-mcp
        run: |
          npm ci
          npm test

      # Build both App UIs, then render them in headless chromium under a mock MCP host to
      # catch bundle/mount/handshake regressions (see viewer-mcp/e2e/apps.spec.ts).
      - name: Build App UIs
        run: make build-ui

      - name: Playwright App-render e2e
        working-directory: packages/mcps/viewer-mcp
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
