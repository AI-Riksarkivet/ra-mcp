name: Dependabot auto-merge

# Auto-merge Dependabot patch/minor updates once CI passes, so the security-alert
# backlog stops accumulating (green PRs previously sat unmerged for months and the
# alert banner reprinted on every push). Major bumps are left for manual review.
# `gh pr merge --auto` only completes after the branch's required status checks
# pass, so this never merges a red PR.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Enable auto-merge for patch/minor updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
