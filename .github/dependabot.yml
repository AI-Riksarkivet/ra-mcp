version: 2
updates:
  # Python dependencies (uv)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Group all Python package updates together
      python-packages:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Docker base images. The Dockerfiles live under .docker/ and in viewer-mcp, not at
  # the repository root, and their FROM lines are pinned by digest: Dependabot moves
  # the tag and the digest together.
  - package-ecosystem: "docker"
    directories:
      - "/.docker"
      - "/packages/mcps/viewer-mcp"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # No "gomod" entry for the two Dagger modules (.dagger, packages/mcps/viewer-mcp/.dagger):
  # their generated bindings (internal/dagger, dagger.gen.go) are not committed, so
  # Dependabot cannot resolve the module and every update run fails. Alerts for both
  # go.mod files still arrive through the dependency graph. Bump them by hand: generate
  # the bindings with `dagger develop`, then `go get` and `go mod tidy` in the module
  # directory.
