replicaCount: 1

image:
  repository: riksarkivet/ra-mcp
  tag: "latest"  # set to "" to use appVersion from Chart.yaml
  pullPolicy: Always

service:
  type: ClusterIP
  port: 7860

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# Idle RSS with every module loaded is ~230Mi; the limit leaves room for
# LanceDB queries and PDF rendering. No CPU limit, so bursts aren't throttled.
# The CPU request is also what autoscaling's utilization target is measured against.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

env:
  RA_MCP_LOG_LEVEL: "INFO"

opentelemetry:
  enabled: false
  endpoint: "http://otel-collector:4317"
  protocol: "grpc"
  serviceName: "ra-mcp"

podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  maxUnavailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

# The server never talks to the Kubernetes API.
automountServiceAccountToken: false

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
